services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-offerly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-offerly}
      POSTGRES_DB: ${POSTGRES_DB:-offerly}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-offerly} -d ${POSTGRES_DB:-offerly}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
